<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3a5a40" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d100e" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agapay" />
    <meta
      name="description"
      content="Agapay helps Filipino farmers decide when and what to plant with hyper-local satellite weather intelligence, waterlogging alerts, and offline/SMS support."
    />
    <link rel="icon" type="image/svg+xml" href="/agapay-icon.svg" />
    <link rel="apple-touch-icon" href="/agapay-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <title>Agapay — Plant at the right time</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #f6f7f4;
        color: #111312;
      }
      html.dark,
      html.dark body {
        background-color: #0d100e;
        color: #f2f4f0;
      }
    </style>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('agapay_theme_mode');
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
